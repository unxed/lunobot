name: dispatch-lint

on:
  push:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Проверка протоколов
        run: |
          status=0
          for f in projects/*/DISPATCH.md; do
            echo "== $f"
            python3 check_dispatch.py "$f" || status=1
          done
          for p in projects/*/; do
            python3 check_branches.py "$(basename "$p")" || status=1
          done
          exit $status
