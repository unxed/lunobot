name: dispatch-lint

on:
  push:
    # захваты и журналы — ветки claims/**, journal/** (claims.py, journal.py): не код учёта, не проверяем
    branches-ignore: ['claims/**', 'journal/**']
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2   # нужен предыдущий коммит, чтобы понять, что добавил этот
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Проверка протоколов
        run: |
          # Проверяем только строки, добавленные этим пушем. Состояние флота — утечки
          # веток, хвосты, протухшие захваты — живёт на пульте: оно ненулевое почти
          # всегда, и гейт из него горел бы постоянно, обесценивая сигнал.
          status=0
          for f in projects/*/DISPATCH.md; do
            # представление refs/claims пишет janitor.py; захват проверяет claims.py take до создания ref
            grep -q "генерируется janitor.py из refs/claims" "$f" && continue
            echo "== $f"
            python3 tools/check_dispatch.py "$f" --added-only || status=1
          done
          exit $status
      - name: Ссылки на разделы инструкции в шапках
        if: always()
        run: python3 tools/check_refs.py
      - name: Формат OWNER_QUEUE.md
        if: always()
        run: python3 tools/check_owner_queue.py
      - name: Метки времени в status
        if: always()
        run: python3 tools/check_status_times.py
