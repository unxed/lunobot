name: owner-question-sweep

# Периодическая уборка тикета «Вопросы владельцу»: убирает запись, только когда вопрос снят
# (тикет закрыт, после вопроса написал не бот, в TRIAGE уже не «ждёт ответа»/«спор»).
# Срока и лимита числа записей нет. См. owner_questions.py.

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: owner-question
  cancel-in-progress: false

jobs:
  sweep:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Подмести записи
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 owner_questions.py sweep
